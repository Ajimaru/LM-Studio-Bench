name: pip-audit

on:
  schedule:
    - cron: '0 7 * * *'  # daily at 07:00 UTC
  push:
    branches: ["main"]
    paths:
      - 'requirements*.txt'
  pull_request:
    branches: ["main"]
    paths:
      - 'requirements*.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gobject-introspection \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Run pip-audit
        run: pip-audit -r requirements-lock.txt --vulnerability-service osv --no-deps
