# CI workflow runs syntax validation and unit tests with coverage
name: CI
permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # allow manual invocation from Actions tab for testing
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      # check out repository code
      - name: Checkout
        uses: actions/checkout@v7

      # prepare Python environment for later checks
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # ensure main python script compiles
      - name: Python syntax check (main script)
        run: python -m py_compile run.py

      # check Python modules in core/ and cli/
      - name: Python syntax check (project modules)
        run: |
          python -m py_compile cli/benchmark.py
          python -m py_compile cli/main.py
          python -m py_compile core/config.py
          python -m py_compile core/paths.py
          python -m py_compile core/tray.py
          python -m py_compile core/version.py
          python -m py_compile core/client.py
          python -m py_compile core/presets.py
          python -m py_compile tools/hardware_monitor.py

      # verify shell script syntax
      - name: Bash syntax check
        run: |
          bash -n setup.sh

      # install shellcheck if not available
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      # lint the shell scripts
      - name: Shellcheck
        run: shellcheck --exclude=SC1091 setup.sh

      # test that main entry point works
      - name: Test entry point
        run: |
          python run.py --help 2>&1 | head -20 || true

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        run-coverage: [true]

    steps:
      # checkout the repo for tests
      - name: Checkout
        uses: actions/checkout@v7

      # set up same Python version
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # install system dependencies for PyGObject (optional)
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgirepository1.0-dev \
            libcairo2 \
            libcairo2-dev \
            gobject-introspection \
            pkg-config

      # install test dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-optional.txt

      # execute unit tests and collect coverage
      - name: Run tests (with coverage)
        if: ${{ matrix.run-coverage }}
        run: |
          pytest --cov-report=xml:coverage.xml

      # send coverage report to Codecov
      - name: Upload coverage to Codecov
        if: ${{ matrix.run-coverage && github.repository == 'Ajimaru/LM-Studio-Bench' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

      # optionally report coverage to Codacy
      - name: Upload coverage to Codacy
        if: ${{ matrix.run-coverage && github.repository == 'Ajimaru/LM-Studio-Bench' }}
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
          # Provider must be one of gh, ghe, gl, gle, bb, bbe — a friendly
          # name like "GitHub" is rejected, so normalise it below.
          CODACY_ORGANIZATION_PROVIDER: ${{ vars.CODACY_ORGANIZATION_PROVIDER || 'gh' }}
          CODACY_USERNAME: ${{ vars.CODACY_USERNAME || github.repository_owner }}
          CODACY_PROJECT_NAME: ${{ vars.CODACY_PROJECT_NAME || github.event.repository.name }}
        continue-on-error: true
        run: |
          if [ -z "${CODACY_API_TOKEN}" ]; then
            echo "Skipping Codacy upload: CODACY_API_TOKEN is not set"
            exit 0
          fi

          # Accept a friendly provider name and map it to the code the
          # reporter expects.
          case "$(printf '%s' "${CODACY_ORGANIZATION_PROVIDER}" | tr '[:upper:]' '[:lower:]')" in
            github|gh)        CODACY_ORGANIZATION_PROVIDER=gh ;;
            githubenterprise) CODACY_ORGANIZATION_PROVIDER=ghe ;;
            gitlab)           CODACY_ORGANIZATION_PROVIDER=gl ;;
            bitbucket)        CODACY_ORGANIZATION_PROVIDER=bb ;;
          esac
          export CODACY_ORGANIZATION_PROVIDER
          echo "Codacy target: ${CODACY_ORGANIZATION_PROVIDER}/${CODACY_USERNAME}/${CODACY_PROJECT_NAME}"

          # The reporter reads CODACY_API_TOKEN plus the three CODACY_*
          # identification variables from the environment. Passing the account
          # token via -t would select the *project* token mode instead, which
          # fails with "Request URL not found" (-t is --project-token,
          # -a is --api-token).
          set +e
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
          codacy_exit=$?
          set -e

          if [ "$codacy_exit" -ne 0 ]; then
            echo "Codacy upload failed (exit ${codacy_exit}); continuing"
            exit 0
          fi
