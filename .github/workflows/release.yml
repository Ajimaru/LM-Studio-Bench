name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-appimage:
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_NAME: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag format
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc|dev|test))?$ ]]; then
            echo "Invalid tag format: $TAG_NAME"
            echo "Expected format: vX.Y.Z or vX.Y.Z-{alpha|beta|rc|dev|test}"
            exit 1
          fi

      - name: Validate VERSION matches tag and set APPIMAGE_NAME
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! -f VERSION ]]; then
            echo "VERSION file not found in repository root"
            exit 1
          fi
          VERSION_FILE="$(tr -d '[:space:]' < VERSION)"
          VERSION_NORMALIZED="${VERSION_FILE##v}"
          TAG_STRIPPED="${TAG_NAME##v}"
          if [[ "$VERSION_NORMALIZED" != "$TAG_STRIPPED" ]]; then
            echo "Tag ($TAG_NAME) does not match VERSION file ($VERSION_FILE)"
            exit 1
          fi
          APPIMAGE_NAME="LM-Studio-Bench-${VERSION_FILE}-x86_64.AppImage"
          {
            echo "VERSION=$VERSION_FILE"
            echo "APPIMAGE_NAME=$APPIMAGE_NAME"
          } >> "$GITHUB_ENV"

      - name: Ensure build scripts are executable
        run: |
          set -euo pipefail
          chmod +x ./scripts/build_appimage.sh
          chmod +x ./scripts/build_appimage_docker.sh

      - name: Build AppImage
        run: |
          set -euo pipefail
          ./scripts/build_appimage_docker.sh

      - name: Verify AppImage artifact
        run: |
          set -euo pipefail
          APPIMAGE_PATH="dist/${APPIMAGE_NAME}"
          [[ -f "$APPIMAGE_PATH" ]] || {
            echo "AppImage missing: $APPIMAGE_PATH"
            exit 1
          }
          ls -lh "$APPIMAGE_PATH"

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum "${APPIMAGE_NAME}" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            dist/${{ env.APPIMAGE_NAME }}
            dist/SHA256SUMS
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    # Configure required owner reviewers on this environment in GitHub settings.
    # Approval is an attestation, not automated legal clearance. In particular,
    # local CMake SDK consent and copying notices do NOT authorize distribution.
    environment: windows-release
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require owner approval and a particular vendor EULA
        env:
          OWNER_APPROVAL: ${{ vars.WINDOWS_VENDOR_REDISTRIBUTION_APPROVED }}
          SDK_ACCEPTANCE: ${{ vars.WINDOWS_VENDOR_BUILD_LICENSES_ACCEPTED }}
          EULA_SHA256: ${{ vars.WINDOWS_VENDOR_EULA_SHA256 }}
          EULA_BASE64: ${{ secrets.WINDOWS_VENDOR_EULA_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:OWNER_APPROVAL -cne 'approved') {
            throw 'Release blocked: explicit owner redistribution approval required.'
          }
          if ($env:SDK_ACCEPTANCE -cne 'accepted') {
            throw 'Native build blocked: explicit owner SDK-license consent required.'
          }
          if ($env:EULA_SHA256 -notmatch '^[a-fA-F0-9]{64}$') {
            throw 'Release blocked: approved vendor EULA SHA256 is required.'
          }
          if (-not $env:EULA_BASE64) {
            throw 'Release blocked: owner-supplied vendor EULA secret is required.'
          }
          $policyDir = Join-Path $PWD 'build\release-policy'
          New-Item -ItemType Directory -Force $policyDir | Out-Null
          $eula = Join-Path $policyDir 'VENDOR-EULA.txt'
          [IO.File]::WriteAllBytes(
            $eula, [Convert]::FromBase64String($env:EULA_BASE64)
          )
          if ((Get-Item -LiteralPath $eula).Length -eq 0) {
            throw 'The owner-supplied vendor EULA is empty.'
          }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $eula).Hash
          if ($digest -ine $env:EULA_SHA256) {
            throw 'Vendor EULA differs from the owner-approved SHA256.'
          }
          "VENDOR_EULA=$eula" >> $env:GITHUB_ENV
          "VENDOR_EULA_SHA256=$($digest.ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.1'
          enable-cache: false

      - name: Restore hash-locked Windows build environment
        run: |
          uv venv build\windows-env --python (Get-Command python).Source --no-project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python build\windows-env\Scripts\python.exe `
            --require-hashes --link-mode copy `
            requirements-windows-lock.txt requirements-windows-build-lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build\windows-env\Scripts\python.exe scripts\build_windows.py `
            --mode release --check-policy --expected-tag $env:GITHUB_REF_NAME `
            --owner-approved-vendor-redistribution `
            --vendor-eula $env:VENDOR_EULA `
            --vendor-eula-sha256 $env:VENDOR_EULA_SHA256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test the real native helper after explicit consent
        run: |
          cmake -S native\gpu_probe -B build\windows_gpu -A x64 `
            -DGPU_PROBE_ACCEPT_VENDOR_LICENSES=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build\windows_gpu --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build\windows_gpu -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Both artifacts are mandatory. The builder fails if the runner has no
      # existing Inno compiler; it never silently skips the installer.
      # Initially unsigned: no Authenticode certificate or signing job exists.
      - name: Build unsigned Windows ZIP and per-user setup.exe
        run: |
          & .\scripts\build_windows.ps1 -Mode release `
            -Python .\build\windows-env\Scripts\python.exe `
            -ExpectedTag $env:GITHUB_REF_NAME `
            -OwnerApprovedVendorRedistribution `
            -VendorEula $env:VENDOR_EULA `
            -VendorEulaSha256 $env:VENDOR_EULA_SHA256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke the copied portable bundle without system Python
        run: |
          $workspace = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) `
            'windows-package-smoke'
          & build\windows-env\Scripts\python.exe scripts\smoke_windows.py `
            --bundle dist\windows\release\LM-Studio-Bench --workspace $workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reject internal packages and verify every required artifact
        run: |
          & build\windows-env\Scripts\python.exe scripts\build_windows.py `
            --mode release --verify-artifacts dist\windows\release `
            --expected-tag $env:GITHUB_REF_NAME `
            --vendor-eula-sha256 $env:VENDOR_EULA_SHA256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload approved Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/windows/release/lm-studio-bench-*-windows-x86_64.zip
            dist/windows/release/lm-studio-bench-*-windows-x86_64-setup.exe
            dist/windows/release/SHA256SUMS-windows.txt
          if-no-files-found: error

  release:
    needs: [build-appimage, build-windows]
    runs-on: ubuntu-24.04
    environment: windows-release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download AppImage
        uses: actions/download-artifact@v8
        with:
          name: appimage
          path: dist/linux

      - name: Download approved Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist/windows

      - name: Recheck checksums and redistribution gate before publishing
        env:
          TAG_NAME: ${{ github.ref_name }}
          OWNER_APPROVAL: ${{ vars.WINDOWS_VENDOR_REDISTRIBUTION_APPROVED }}
          EULA_SHA256: ${{ vars.WINDOWS_VENDOR_EULA_SHA256 }}
        run: |
          set -euo pipefail
          [[ "$OWNER_APPROVAL" == approved ]] || {
            echo "Release blocked: owner approval is no longer present."
            exit 1
          }
          (cd dist/linux && sha256sum -c SHA256SUMS)
          python3 scripts/build_windows.py --mode release \
            --verify-artifacts dist/windows --expected-tag "$TAG_NAME" \
            --vendor-eula-sha256 "$EULA_SHA256"

      - name: Publish all mandatory platform artifacts together
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/linux/*.AppImage
            dist/linux/SHA256SUMS
            dist/windows/lm-studio-bench-*-windows-x86_64.zip
            dist/windows/lm-studio-bench-*-windows-x86_64-setup.exe
            dist/windows/SHA256SUMS-windows.txt
          fail_on_unmatched_files: true