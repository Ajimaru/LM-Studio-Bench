version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/"
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # PyGObject 3.52+ builds against girepository-2.0, which Ubuntu 24.04
      # does not ship - the AppImage builder installs libgirepository1.0-dev.
      # requirements.txt caps the range at <3.50 for that reason. Closing the
      # group PR does not teach Dependabot this, so state it here: without
      # the rule the same unbuildable bump returns every month (see #84).
      # Lift this together with the cap once the base image moves on.
      - dependency-name: "pygobject"
        versions: [">=3.50"]
    groups:
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"
      # Major bumps are deliberately not listed here: they stay individual
      # PRs, since those are the ones that actually break things.
      production-dependencies:
        dependency-type: production
        patterns:
          - "*"
        update-types:
          - minor
          - patch
