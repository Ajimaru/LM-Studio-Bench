context_length: 8192
gpu_offload: 1.0
temperature: 0.1
# Reasoning models spend hundreds of tokens thinking before they answer.
# At 256 the answer was cut off and scored as wrong; see truncated_tests in
# the reports.
max_tokens: 2000
max_tests_per_capability: 10

# Wall-clock limit per generated-code execution (code capability).
code_timeout_seconds: 10
use_rest_api: true

data_dir: tests/data
prompts_dir: tests/prompts

timeout_seconds: 300

metric_weights:
  general_text:
    rouge-1: 0.3
    rouge-l: 0.4
    f1: 0.3
  # accuracy carries reasoning: it extracts the final answer, so a model may
  # show its work without being punished. exact_match demanded that the whole
  # response equal the reference, which no explaining model can satisfy, and
  # token-F1 against a one-word reference rewarded terseness over correctness.
  reasoning:
    accuracy: 0.8
    exact_match: 0.1
    f1: 0.1
  vision:
    accuracy: 0.6
    rouge-l: 0.4
  tooling:
    function_call_accuracy: 0.7
    accuracy: 0.3
  # Code is pass/fail by execution; nothing else contributes.
  code:
    code_execution: 1.0

composite_score_weights:
  quality: 0.6
  performance: 0.2
  efficiency: 0.2

lmstudio:
  host: localhost
  ports:
    - 1234
    - 1235
  api_token: null
