# PyProject Configuration for LM-Studio-Bench
# See: https://peps.python.org/pep-0518/

[project]
name = "lm-studio-bench"
# Version mirrors VERSION after stripping any leading "v"; bump both
# together.
version = "0.2.0"
requires-python = ">=3.11"

[tool.isort]
# Profile compatible with Black
profile = "black"

# Line length
line_length = 88

# Multi-line import style
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# Import order
force_sort_within_sections = true
# lexicographical was dropped: it sorts "pkg.sub.mod" before "pkg.sub import x"
# in a way Ruff cannot reproduce, so editors flagged I001 on files isort had
# just formatted. Only two files were affected by the difference.

# Group imports
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["core", "cli", "agents", "web", "tools"]

# Skip directories
skip_glob = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "*.egg-info",
    ".tox",
    ".pytest_cache",
    ".mypy_cache",
    "node_modules",
    "book"
]

# Don't skip __init__.py files
skip_gitignore = false

# Ruff is not part of the enforced toolchain - the pre-commit hook runs
# isort, flake8 and pylint. Editors ship Ruff anyway, and with its own
# defaults it contradicts what those tools just produced. Everything below
# mirrors .flake8 and [tool.isort] so the editor agrees with the hook.
# Keep in sync when either of those changes.
[tool.ruff]
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "*.egg-info",
    ".tox",
    ".pytest_cache",
    ".mypy_cache",
    "node_modules",
    "book",
]

[tool.ruff.lint]
# Mirrors what the hook actually enforces, not what .flake8 nominally
# selects: pycodestyle and pyflakes, plus isort, which flake8 does not cover.
#
# Deliberately absent:
#   C90 (mccabe) - .flake8 selects it but then ignores C901, so complexity is
#       not enforced. Enabling it here would flag 41 existing functions.
#   N   (pep8-naming) - .flake8 selects it, but the plugin is not in
#       requirements-dev.txt, so flake8 silently skips it. 13 findings would
#       appear if it were installed.
# Both are opinions worth having; turning either on is a decision about the
# codebase, not about editor configuration.
select = ["E", "W", "F", "I"]
ignore = [
    # Whitespace before ':' - conflicts with black's slice formatting.
    "E203",
    # Line too long: .flake8 ignores it as well, so the 88 above only steers
    # formatters, it does not fail a check.
    "E501",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["core", "cli", "agents", "web", "tools"]

[tool.djlint]
# Profile for Django/Jinja templates
profile = "jinja"

# Line length
line_length = 88

# Indentation
indent = 2

# Formatting options
use_formatter = true
close_void_tags = false
format_css = false
format_js = false
preserve_blank_lines = true

# Exclude patterns (comma-separated)
exclude = ".git,__pycache__,.venv,venv,env,build,dist,.tox,.pytest_cache,node_modules"
