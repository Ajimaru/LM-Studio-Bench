# PyProject Configuration for LM-Studio-Bench
# See: https://peps.python.org/pep-0518/

[project]
name = "lm-studio-bench"
# Version mirrors VERSION after stripping any leading "v"; bump both
# together.
version = "0.2.0"
requires-python = ">=3.11"

# Ruff is the single source of truth for linting and import order. It
# replaced flake8 and isort, which needed two config files that editors then
# contradicted with their own defaults. The pre-commit hook runs the same
# rules defined here, so editor and hook cannot disagree.
[tool.ruff]
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "*.egg-info",
    ".tox",
    ".pytest_cache",
    ".mypy_cache",
    "node_modules",
    "book",
]

[tool.ruff.lint]
# pycodestyle (E, W), pyflakes (F) and import order (I) - the rules the
# previous flake8 + isort pair actually enforced.
#
# Deliberately absent, both inherited from the old .flake8:
#   C90 (mccabe)      - was selected there but immediately ignored again, so
#                       complexity never ran. 41 functions would be flagged.
#   N   (pep8-naming) - was selected but the plugin was never installed, so
#                       flake8 skipped it silently. 13 findings would appear.
# Enabling either is a decision about the codebase, not about tooling.
select = ["E", "W", "F", "I"]
ignore = [
    # Whitespace before ':' - conflicts with black's slice formatting.
    "E203",
    # Line too long: .flake8 ignores it as well, so the 88 above only steers
    # formatters, it does not fail a check.
    "E501",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["core", "cli", "agents", "web", "tools"]

[tool.djlint]
# Profile for Django/Jinja templates
profile = "jinja"

# Line length
line_length = 88

# Indentation
indent = 2

# Formatting options
use_formatter = true
close_void_tags = false
format_css = false
format_js = false
preserve_blank_lines = true

# Exclude patterns (comma-separated)
exclude = ".git,__pycache__,.venv,venv,env,build,dist,.tox,.pytest_cache,node_modules"
